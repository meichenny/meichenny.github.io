baseURL: https://meichenny.github.io/
locale: en-us
title: Mei Chen
theme: PaperMod
copyright: "© Mei Chen"
enableRobotsTXT: true
enableEmoji: false
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON]

services:
  rss:
    limit: 50

params:
  env: production
  title: Mei Chen
  description: "What is new in AI agents and voice AI, what it means in practice, and what we learn running our own agents. With sources."
  author: Mei Chen
  # Share-card fallback (og:image, twitter:image) for pages without their own image.
  images: [images/og-card.png]
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: false
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  comments: false
  hidemeta: false
  hideSummary: false
  disableSpecial1stPost: false
  displayFullLangName: true
  mainSections: [posts]
  homeInfoParams:
    Title: "Mei's notes"
    Content: >-
      I'm Mei Chen, Content Director at VantaSoft and Telvana. I read the latest AI launches,
      papers and benchmarks, mostly about voice agents and agents doing real work for businesses,
      and write about what they mean in practice, with the sources behind each claim. Some posts
      come from running our own team of AI agents.
  socialIcons:
    - name: github
      url: https://github.com/meichenny
    - name: threads
      url: https://www.threads.com/@meichen.ny
    - name: x
      url: https://x.com/meichen_ny
    - name: rss
      url: /index.xml
  footer:
    text: "[VantaSoft](https://www.vantasoft.com) · [Telvana](https://telvana.com)"
  assets:
    disableHLJS: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: [title, permalink, summary, content]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50

taxonomies:
  tag: tags

permalinks:
  page:
    posts: /posts/:year-:month-:day-:slug/

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false
    style: monokai
  tableOfContents:
    startLevel: 2
    endLevel: 4
